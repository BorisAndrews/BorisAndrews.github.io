<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.forward_to | absolute_url }}">
    <script>
      location.replace("{{ page.forward_to | relative_url }}" + (location.hash || "{{ page.forward_hash }}"));
    </script>
    <meta http-equiv="refresh" content="0; url={{ page.forward_to | relative_url }}{{ page.forward_hash }}">
  </head>
  <body>
    <p><a href="{{ page.forward_to | relative_url }}{{ page.forward_hash }}">Click here if you are not redirected.</a></p>
  </body>
</html>
